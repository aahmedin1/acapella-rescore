services:
  app:
    build: .
    # no ports: exposed only to the nginx container on the internal network,
    # never to the host. Nothing else on the VPS can collide with it.
    expose:
      - "8000"
    volumes:
      # job outputs persist across restarts; credits.db lives in the
      # container (resets on recreate -- fine for the demo phase)
      - app-data:/app/web/jobs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
