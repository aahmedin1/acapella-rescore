services:
  app:
    build: .
    # The VPS already runs nginx on 80/443, so this deployment does NOT
    # run its own nginx container. The app listens on host port 8100
    # (free on the VPS); it can be visited directly at http://VPS_IP:8100,
    # or the existing nginx can proxy to it later.
    ports:
      - "8100:8000"
    volumes:
      # job outputs persist across restarts; credits.db lives in the
      # container (resets on recreate -- fine for the demo phase)
      - app-data:/app/web/jobs
    restart: unless-stopped

volumes:
  app-data:
