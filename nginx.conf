events {}
http {
    # slow down anyone hammering the job endpoint
    limit_req_zone $binary_remote_addr zone=jobs:10m rate=5r/m;

    server {
        listen 80;
        server_name _;

        # match the app's 100MB upload cap
        client_max_body_size 100m;

        # Rate limit applies ONLY to job creation (exact-match location).
        # Status polling hits /api/jobs/<id> every 2s from the frontend, so
        # it must NOT be rate-limited: the old single /api/jobs block
        # 503'd the polls after burst=3 and froze the progress bar.
        location = /api/jobs {
            limit_req zone=jobs burst=3 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # rescore jobs run for minutes; don't cut the connection
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location /api/jobs/ {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # rescore jobs run for minutes; don't cut the connection
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
        }
    }
}
